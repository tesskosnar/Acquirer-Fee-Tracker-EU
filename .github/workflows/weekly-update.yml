name: Weekly acquirer fee update

on:
  schedule:
    # Každé pondělí v 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {}   # umožní ruční "Run workflow" v záložce Actions

permissions:
  contents: write   # potřeba, aby workflow mohl commitnout aktualizovaná data zpět

concurrency:
  group: weekly-acquirer-fee-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt

      - name: Spustit týdenní aktualizaci (kurz ČNB + kontrola zdrojů + přepočet)
        run: python scraper/update.py

      - name: Spustit testy (kontrola, že se nic nerozbilo)
        run: python -m pytest -q

      - name: Commitnout aktualizovaná data
        run: |
          git config user.name "acquirer-fee-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Žádná změna dat, není co commitovat."
          else
            git commit -m "chore: týdenní aktualizace poplatků ($(date -u +%Y-%m-%d))"
            git push
          fi
